version: '3.9'

services:

  postgres:
    image: postgis/postgis:15-3.4
    container_name: zoonoses-postgres
    environment:
      POSTGRES_DB: zoonoses_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_before_deploy}
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost only — not exposed to internet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: zoonoses-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"   # API accessible on all interfaces
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:${DB_PASSWORD:-changeme_before_deploy}@postgres:5432/zoonoses_db
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: zoonoses-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
